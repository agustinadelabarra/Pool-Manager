<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Evento</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #E8845A;
    --naranja-light: #FDF0E8;
    --naranja-dark: #C4623A;
    --verde: #5A8A6A;
    --verde-light: #E8F2EC;
    --verde-dark: #3D6B4F;
    --crema: #FDF6F0;
    --texto: #2D2D2D;
    --texto-soft: #6B6B6B;
    --borde: #E5D8CE;
    --blanco: #FFFFFF;
    --shadow: 0 2px 12px rgba(232,132,90,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--crema); color: var(--texto); min-height: 100vh; padding: 24px 16px 48px; }

  .header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
  .header h1 { font-family: 'Fraunces', serif; font-size: 26px; color: var(--texto); margin-bottom: 4px; }
  .header p { color: var(--texto-soft); font-size: 14px; }

  .card { background: var(--blanco); border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--borde); max-width: 480px; margin-left: auto; margin-right: auto; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .field input { width: 100%; padding: 11px 13px; border: 1.5px solid var(--borde); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--texto); background: var(--crema); outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: var(--naranja); background: var(--blanco); }
  .field input::placeholder { color: #BDB0A8; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Propósito */
  .proposito-options { display: flex; flex-direction: column; gap: 8px; }
  .proposito-option { position: relative; cursor: pointer; }
  .proposito-option input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .proposito-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--borde); border-radius: 10px; background: var(--crema); transition: all 0.2s; cursor: pointer; }
  .proposito-option input[type="radio"]:checked + .proposito-card { border-color: var(--naranja); background: var(--naranja-light); }
  .proposito-emoji { font-size: 18px; flex-shrink: 0; }
  .proposito-label { font-size: 14px; font-weight: 600; color: var(--texto); }
  .proposito-frase { font-size: 12px; color: var(--texto-soft); line-height: 1.3; margin-top: 1px; }
  .proposito-option input[type="radio"]:checked + .proposito-card .proposito-label { color: var(--naranja-dark); }
  .proposito-option input[type="radio"]:checked + .proposito-card .proposito-frase { color: var(--naranja-dark); opacity: 0.75; }

  .btn-crear { width: 100%; max-width: 480px; display: block; margin: 8px auto 0; padding: 16px; background: var(--naranja); color: var(--blanco); border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn-crear:hover { background: var(--naranja-dark); }
  .btn-crear:active { transform: scale(0.98); }

  /* Pantalla éxito */
  .link-screen { display: none; max-width: 480px; margin: 0 auto; text-align: center; }
  .link-screen.visible { display: block; }
  .success-icon { width: 64px; height: 64px; background: var(--verde-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
  .link-screen h2 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 6px; }
  .link-screen p { color: var(--texto-soft); font-size: 14px; margin-bottom: 24px; }

  .evento-preview { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 18px; margin-bottom: 16px; text-align: left; box-shadow: var(--shadow); }
  .evento-nombre { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .evento-meta { font-size: 13px; color: var(--texto-soft); margin-bottom: 10px; }
  .evento-frase { font-size: 13px; color: var(--naranja-dark); background: var(--naranja-light); padding: 8px 12px; border-radius: 8px; line-height: 1.4; font-weight: 500; }

  .btn-copiar { width: 100%; padding: 14px; background: var(--verde); color: var(--blanco); border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn-copiar:hover { background: var(--verde-dark); }
  .btn-copiar.copiado { background: var(--verde-dark); }

  .form-screen.hidden { display: none; }
</style>
</head>
<body>

<div class="form-screen" id="formScreen">
  <div class="header">
    <h1>Nuevo evento</h1>
    <p>Completá los datos y compartí el link</p>
  </div>

  <div class="card">
    <div class="field">
      <label>Nombre del evento</label>
      <input type="text" id="nombre" placeholder="Ej: Final de temporada hockey">
    </div>
    <div class="field">
      <label>Destino</label>
      <input type="text" id="destino" placeholder="Ej: Club San Isidro, Blanco Encalada 3456">
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="row">
      <div class="field">
        <label>Hora ida</label>
        <input type="time" id="hora_ida">
      </div>
      <div class="field">
        <label>Hora vuelta</label>
        <input type="time" id="hora_vuelta">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="proposito-options">
      <label class="proposito-option">
        <input type="radio" name="proposito" value="equidad" checked>
        <div class="proposito-card">
          <div class="proposito-emoji">⚖️</div>
          <div>
            <div class="proposito-label">Equidad</div>
            <div class="proposito-frase">Somos un grupo que se propone que todos participen</div>
          </div>
        </div>
      </label>
      <label class="proposito-option">
        <input type="radio" name="proposito" value="logistica">
        <div class="proposito-card">
          <div class="proposito-emoji">🗺️</div>
          <div>
            <div class="proposito-label">Logística</div>
            <div class="proposito-frase">Nos organizamos para llegar de la forma más eficiente</div>
          </div>
        </div>
      </label>
      <label class="proposito-option">
        <input type="radio" name="proposito" value="ambos">
        <div class="proposito-card">
          <div class="proposito-emoji">⚖️🗺️</div>
          <div>
            <div class="proposito-label">Equidad + Logística</div>
            <div class="proposito-frase">Nos proponemos que todos participen, organizándonos de la forma más eficiente</div>
          </div>
        </div>
      </label>
      <label class="proposito-option">
        <input type="radio" name="proposito" value="ninguno">
        <div class="proposito-card">
          <div class="proposito-emoji">🤝</div>
          <div>
            <div class="proposito-label">Sin propósito declarado</div>
            <div class="proposito-frase">Solo coordinamos los viajes</div>
          </div>
        </div>
      </label>
    </div>
  </div>

  <button class="btn-crear" onclick="crearEvento()">Crear evento →</button>
</div>

<div class="link-screen" id="linkScreen">
  <div class="success-icon">✅</div>
  <h2>¡Evento creado!</h2>
  <p>Compartí este link con todas las familias</p>
  <div class="evento-preview">
    <div class="evento-nombre" id="preview-nombre"></div>
    <div class="evento-meta" id="preview-meta"></div>
    <div class="evento-frase" id="preview-frase" style="display:none"></div>
  </div>
  <button class="btn-copiar" id="btnCopiar" onclick="copiarLink()">📋 Copiar link para compartir</button>
</div>

<script>
const SUPABASE_URL = 'https://zvvcodeqfscqvunogppg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dmNvZGVxZnNjcXZ1bm9ncHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTgxMTksImV4cCI6MjA5NjEzNDExOX0.CrmSFILnBGoLcpzMW9QeAI_QUqbxwRWB-CTdB4Au11Y';

const FRASES = {
  equidad: 'Somos un grupo que se propone que todos participen',
  logistica: 'Nos organizamos para llegar de la forma más eficiente',
  ambos: 'Nos proponemos que todos participen, organizándonos de la forma más eficiente'
};

let linkGenerado = '';

function generarToken() { return Math.random().toString(36).substring(2,10) + Math.random().toString(36).substring(2,10); }
function formatFecha(f) {
  if (!f) return '';
  const [y,m,d] = f.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`;
}

async function crearEvento() {
  const nombre = document.getElementById('nombre').value.trim();
  const destino = document.getElementById('destino').value.trim();
  const fecha = document.getElementById('fecha').value;
  const hora_ida = document.getElementById('hora_ida').value;
  const hora_vuelta = document.getElementById('hora_vuelta').value;
  const proposito = document.querySelector('input[name="proposito"]:checked').value;
  if (!nombre || !destino || !fecha) { alert('Completá nombre, destino y fecha.'); return; }
  const token = generarToken();
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/evento_eventos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' },
      body: JSON.stringify({ nombre, destino, fecha, hora_ida: hora_ida || null, hora_vuelta: hora_vuelta || null, proposito, link_token: token })
    });
    if (!res.ok) throw new Error(await res.text());
    mostrarExito(nombre, destino, fecha, hora_ida, hora_vuelta, proposito, token);
  } catch(e) { console.error(e); alert('Error al crear el evento.'); }
}

function mostrarExito(nombre, destino, fecha, hora_ida, hora_vuelta, proposito, token) {
  linkGenerado = `${window.location.origin}${window.location.pathname.replace('eventos.html','evento.html')}?token=${token}`;
  document.getElementById('preview-nombre').textContent = nombre;
  let meta = formatFecha(fecha);
  if (destino) meta += ` · ${destino}`;
  if (hora_ida) meta += ` · Ida ${hora_ida.substring(0,5)}`;
  if (hora_vuelta) meta += ` · Vuelta ${hora_vuelta.substring(0,5)}`;
  document.getElementById('preview-meta').textContent = meta;
  if (proposito !== 'ninguno') {
    const el = document.getElementById('preview-frase');
    el.textContent = FRASES[proposito];
    el.style.display = 'block';
  }
  document.getElementById('formScreen').classList.add('hidden');
  document.getElementById('linkScreen').classList.add('visible');
}

function copiarLink() {
  navigator.clipboard.writeText(linkGenerado).then(() => {
    const btn = document.getElementById('btnCopiar');
    btn.textContent = '✅ Link copiado';
    btn.classList.add('copiado');
    setTimeout(() => { btn.textContent = '📋 Copiar link para compartir'; btn.classList.remove('copiado'); }, 2000);
  });
}
</script>
</body>
</html>
