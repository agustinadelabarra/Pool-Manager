<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Evento — Viajes Compartidos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #E8845A;
    --naranja-light: #FDF0E8;
    --naranja-dark: #C4623A;
    --verde: #5A8A6A;
    --verde-light: #E8F2EC;
    --verde-dark: #3D6B4F;
    --crema: #FDF6F0;
    --texto: #2D2D2D;
    --texto-soft: #6B6B6B;
    --borde: #E5D8CE;
    --blanco: #FFFFFF;
    --shadow: 0 2px 12px rgba(232,132,90,0.12);
    --shadow-lg: 0 8px 32px rgba(232,132,90,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header-tag {
    display: inline-block;
    background: var(--naranja-light);
    color: var(--naranja-dark);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--texto);
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .header p {
    color: var(--texto-soft);
    font-size: 14px;
  }

  .card {
    background: var(--blanco);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--borde);
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--texto);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title .icon {
    width: 28px;
    height: 28px;
    background: var(--naranja-light);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--texto-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--borde);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--texto);
    background: var(--crema);
    transition: border-color 0.2s;
    outline: none;
  }

  .field input:focus {
    border-color: var(--naranja);
    background: var(--blanco);
  }

  .field input::placeholder {
    color: #BDB0A8;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Propósito */
  .proposito-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .proposito-option {
    position: relative;
    cursor: pointer;
  }

  .proposito-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .proposito-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--borde);
    border-radius: 12px;
    background: var(--crema);
    transition: all 0.2s;
    cursor: pointer;
  }

  .proposito-option input[type="radio"]:checked + .proposito-card {
    border-color: var(--naranja);
    background: var(--naranja-light);
  }

  .proposito-emoji {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .proposito-text {
    flex: 1;
  }

  .proposito-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    margin-bottom: 2px;
  }

  .proposito-frase {
    font-size: 12px;
    color: var(--texto-soft);
    font-style: italic;
    line-height: 1.4;
  }

  .proposito-option input[type="radio"]:checked + .proposito-card .proposito-label {
    color: var(--naranja-dark);
  }

  .proposito-option input[type="radio"]:checked + .proposito-card .proposito-frase {
    color: var(--naranja-dark);
    opacity: 0.8;
  }

  /* Botón */
  .btn-crear {
    width: 100%;
    max-width: 480px;
    display: block;
    margin: 8px auto 0;
    padding: 16px;
    background: var(--naranja);
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .btn-crear:hover {
    background: var(--naranja-dark);
  }

  .btn-crear:active {
    transform: scale(0.98);
  }

  /* Pantalla de link generado */
  .link-screen {
    display: none;
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }

  .link-screen.visible {
    display: block;
  }

  .success-icon {
    width: 64px;
    height: 64px;
    background: var(--verde-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
  }

  .link-screen h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .link-screen p {
    color: var(--texto-soft);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .evento-preview {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .evento-nombre {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .evento-meta {
    font-size: 13px;
    color: var(--texto-soft);
    margin-bottom: 12px;
  }

  .evento-frase {
    font-size: 12px;
    font-style: italic;
    color: var(--naranja-dark);
    background: var(--naranja-light);
    padding: 8px 12px;
    border-radius: 8px;
    line-height: 1.4;
  }

  .link-box {
    background: var(--crema);
    border: 1.5px solid var(--borde);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--texto-soft);
    word-break: break-all;
    text-align: left;
    margin-bottom: 12px;
    font-family: monospace;
  }

  .btn-copiar {
    width: 100%;
    padding: 14px;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-copiar:hover {
    background: var(--verde-dark);
  }

  .btn-copiar.copiado {
    background: var(--verde-dark);
  }

  .form-screen {
    max-width: 480px;
    margin: 0 auto;
  }

  .form-screen.hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">Viajes compartidos</div>
  <h1>Crear nuevo evento</h1>
  <p>Completá los datos y compartí el link con el grupo</p>
</div>

<!-- Formulario -->
<div class="form-screen" id="formScreen">

  <div class="card">
    <div class="card-title">
      <div class="icon">📍</div>
      Datos del evento
    </div>

    <div class="field">
      <label>Nombre del evento</label>
      <input type="text" id="nombre" placeholder="Ej: Final de temporada hockey">
    </div>

    <div class="field">
      <label>Destino</label>
      <input type="text" id="destino" placeholder="Ej: Club San Isidro, Blanco Encalada 3456">
    </div>

    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>

    <div class="row">
      <div class="field">
        <label>Hora ida</label>
        <input type="time" id="hora_ida">
      </div>
      <div class="field">
        <label>Hora vuelta</label>
        <input type="time" id="hora_vuelta">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="icon">🤝</div>
      Propósito del grupo
    </div>

    <div class="proposito-options">

      <label class="proposito-option">
        <input type="radio" name="proposito" value="equidad" checked>
        <div class="proposito-card">
          <div class="proposito-emoji">⚖️</div>
          <div class="proposito-text">
            <div class="proposito-label">Equidad</div>
            <div class="proposito-frase">"Somos un grupo que se propone que todos participen"</div>
          </div>
        </div>
      </label>

      <label class="proposito-option">
        <input type="radio" name="proposito" value="logistica">
        <div class="proposito-card">
          <div class="proposito-emoji">🗺️</div>
          <div class="proposito-text">
            <div class="proposito-label">Logística</div>
            <div class="proposito-frase">"Nos organizamos para llegar de la forma más eficiente"</div>
          </div>
        </div>
      </label>

      <label class="proposito-option">
        <input type="radio" name="proposito" value="ambos">
        <div class="proposito-card">
          <div class="proposito-emoji">⚖️🗺️</div>
          <div class="proposito-text">
            <div class="proposito-label">Equidad + Logística</div>
            <div class="proposito-frase">"Nos proponemos que todos participen, organizándonos de la forma más eficiente"</div>
          </div>
        </div>
      </label>

    </div>
  </div>

  <button class="btn-crear" onclick="crearEvento()">Crear evento y generar link →</button>

</div>

<!-- Pantalla link generado -->
<div class="link-screen" id="linkScreen">

  <div class="success-icon">✅</div>
  <h2>¡Evento creado!</h2>
  <p>Compartí este link con todas las familias del grupo</p>

  <div class="evento-preview">
    <div class="evento-nombre" id="preview-nombre"></div>
    <div class="evento-meta" id="preview-meta"></div>
    <div class="evento-frase" id="preview-frase"></div>
  </div>

  <div class="link-box" id="linkBox"></div>

  <button class="btn-copiar" id="btnCopiar" onclick="copiarLink()">
    📋 Copiar link para compartir
  </button>

</div>

<script>
  const SUPABASE_URL = 'https://zvvcodeqfscqvunogppg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dmNvZGVxZnNjcXZ1bm9ncHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTgxMTksImV4cCI6MjA5NjEzNDExOX0.CrmSFILnBGoLcpzMW9QeAI_QUqbxwRWB-CTdB4Au11Y';

  const FRASES = {
    equidad: 'Somos un grupo que se propone que todos participen',
    logistica: 'Nos organizamos para llegar de la forma más eficiente',
    ambos: 'Nos proponemos que todos participen, organizándonos de la forma más eficiente'
  };

  function generarToken() {
    return Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
  }

  function formatFecha(fechaStr) {
    if (!fechaStr) return '';
    const [y, m, d] = fechaStr.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`;
  }

  async function crearEvento() {
    const nombre = document.getElementById('nombre').value.trim();
    const destino = document.getElementById('destino').value.trim();
    const fecha = document.getElementById('fecha').value;
    const hora_ida = document.getElementById('hora_ida').value;
    const hora_vuelta = document.getElementById('hora_vuelta').value;
    const proposito = document.querySelector('input[name="proposito"]:checked').value;

    if (!nombre || !destino || !fecha) {
      alert('Completá al menos nombre, destino y fecha.');
      return;
    }

    const token = generarToken();

    const body = {
      nombre,
      destino,
      fecha,
      hora_ida: hora_ida || null,
      hora_vuelta: hora_vuelta || null,
      proposito,
      link_token: token
    };

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/evento_eventos`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }

      mostrarLink(nombre, destino, fecha, hora_ida, hora_vuelta, proposito, token);

    } catch (e) {
      console.error(e);
      alert('Error al crear el evento. Revisá la consola.');
    }
  }

  function mostrarLink(nombre, destino, fecha, hora_ida, hora_vuelta, proposito, token) {
    const link = `${window.location.origin}${window.location.pathname.replace('eventos.html', '')}evento.html?token=${token}`;

    document.getElementById('preview-nombre').textContent = nombre;

    let meta = formatFecha(fecha);
    if (destino) meta += ` · ${destino}`;
    if (hora_ida) meta += ` · Ida ${hora_ida}`;
    if (hora_vuelta) meta += ` · Vuelta ${hora_vuelta}`;
    document.getElementById('preview-meta').textContent = meta;

    document.getElementById('preview-frase').textContent = `"${FRASES[proposito]}"`;
    document.getElementById('linkBox').textContent = link;

    document.getElementById('formScreen').classList.add('hidden');
    document.getElementById('linkScreen').classList.add('visible');
  }

  function copiarLink() {
    const link = document.getElementById('linkBox').textContent;
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.getElementById('btnCopiar');
      btn.textContent = '✅ Link copiado';
      btn.classList.add('copiado');
      setTimeout(() => {
        btn.textContent = '📋 Copiar link para compartir';
        btn.classList.remove('copiado');
      }, 2000);
    });
  }
</script>

</body>
</html>
