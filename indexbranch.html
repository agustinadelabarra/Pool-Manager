<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pool</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1B4332;
    --verde-mid: #2D6A4F;
    --verde-claro: #40916C;
    --verde-light: #52B788;
    --amarillo: #E9C46A;
    --rojo: #E76F51;
    --fondo: #F4F1EC;
    --blanco: #FFFFFF;
    --texto: #1A1A1A;
    --gris: #888;
    --gris-claro: #E8E4DC;
    --sombra: 0 1px 8px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    font-size: 14px;
  }

  .header {
    background: var(--verde);
    padding: 10px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pool-nombre {
    font-size: 17px;
    font-weight: 700;
    color: var(--blanco);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .selector-familia {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 5px 8px;
    color: var(--blanco);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    max-width: 145px;
  }

  .selector-familia option { color: var(--texto); background: var(--blanco); }

  .btn-mapa {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 19px;
    flex-shrink: 0;
    text-decoration: none;
  }

  .nav-mes {
    background: var(--verde-mid);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
  }

  .mes-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--blanco);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-mes {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    color: var(--blanco);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .leyenda {
    display: flex;
    gap: 12px;
    padding: 6px 14px;
    background: var(--blanco);
    border-bottom: 1px solid var(--gris-claro);
  }

  .ley-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--gris);
    font-weight: 500;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-ok { background: var(--verde-light); }
  .dot-warn { background: var(--amarillo); }
  .dot-cancel { background: var(--rojo); }

  .fechas-list {
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fecha-card {
    background: var(--blanco);
    border-radius: 10px;
    padding: 9px 11px;
    box-shadow: var(--sombra);
    border-left: 3px solid var(--verde-light);
  }

  .fecha-card.warning { border-left-color: var(--amarillo); }
  .fecha-card.cancelada { border-left-color: var(--rojo); opacity: 0.6; }

  .fecha-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .fecha-dia {
    font-size: 16px;
    font-weight: 700;
    color: var(--texto);
  }

  .fecha-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .badge-ok { background: #E3F4EC; color: var(--verde-mid); }
  .badge-warn { background: #FDF3D8; color: #9A6D0A; }
  .badge-cancel { background: #FDECEA; color: var(--rojo); }

  .fecha-motivo {
    font-size: 10px;
    color: var(--gris);
    margin-bottom: 6px;
    margin-top: -3px;
  }

  .grilla {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .asig-box {
    background: var(--fondo);
    border-radius: 7px;
    padding: 6px 8px;
  }

  .asig-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .asig-nombre {
    font-size: 13px;
    font-weight: 700;
    color: var(--texto);
  }

  .asig-vacio {
    font-size: 11px;
    color: var(--gris);
    font-style: italic;
  }

  .botones-disp {
    margin-top: 6px;
  }

  .toggle-btn {
    border: 1.5px solid var(--gris-claro);
    background: var(--blanco);
    border-radius: 7px;
    padding: 6px 0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--gris);
    text-align: center;
    width: 100%;
  }

  .toggle-btn.activo-ida {
    background: var(--verde);
    border-color: var(--verde);
    color: var(--blanco);
  }

  .toggle-btn.activo-vuelta {
    background: var(--verde-claro);
    border-color: var(--verde-claro);
    color: var(--blanco);
  }

  .toggle-btn.activo-voy {
    background: var(--verde);
    border-color: var(--verde);
    color: var(--blanco);
  }

  .toggle-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nota-container {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--gris-claro);
  }

  .nota-input {
    width: 100%;
    border: 1px solid var(--gris-claro);
    border-radius: 7px;
    padding: 5px 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--texto);
    background: var(--fondo);
    resize: none;
    outline: none;
  }

  .nota-input:focus {
    border-color: var(--verde-claro);
  }

  .sin-familia {
    font-size: 10px;
    color: var(--amarillo);
    font-weight: 500;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--gris-claro);
  }

  .version {
    text-align: center;
    padding: 12px;
    font-size: 10px;
    color: var(--gris);
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--gris);
    gap: 10px;
  }

  .spinner {
    width: 26px;
    height: 26px;
    border: 2px solid var(--gris-claro);
    border-top-color: var(--verde);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--texto);
    color: var(--blanco);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    transition: transform 0.25s ease;
    z-index: 1000;
    white-space: nowrap;
  }

  .toast.visible { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="pool-nombre" id="poolNombre">Pool</div>
  <select class="selector-familia" id="selectFamilia" onchange="onFamiliaChange()">
    <option value="">¿Quién sos?</option>
  </select>
  <a class="btn-mapa" href="#" onclick="abrirMapa(event)">🚗</a>
</div>

<div class="nav-mes">
  <button class="btn-mes" onclick="cambiarMes(-1)">‹</button>
  <div class="mes-label" id="mesLabel">—</div>
  <button class="btn-mes" onclick="cambiarMes(1)">›</button>
</div>

<div class="leyenda">
  <div class="ley-item"><div class="dot dot-ok"></div> Normal</div>
  <div class="ley-item"><div class="dot dot-warn"></div> Tránsito complicado</div>
  <div class="ley-item"><div class="dot dot-cancel"></div> Cancelada</div>
</div>

<div class="fechas-list" id="fechasList">
  <div class="loading"><div class="spinner"></div><span>Cargando...</span></div>
</div>

<div class="version">v1.0-db</div>
<div class="toast" id="toast"></div>

<script>
// ── SUPABASE CONFIG ──────────────────────────────────────────────
const SUPABASE_URL = "https://zvvcodeqfscqvunogppg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dmNvZGVxZnNjcXZ1bm9ncHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTgxMTksImV4cCI6MjA5NjEzNDExOX0.CrmSFILnBGoLcpzMW9QeAI_QUqbxwRWB-CTdB4Au11Y";

async function sbGet(table, params = "") {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    }
  });
  if (!res.ok) throw new Error(`Error ${res.status} en ${table}`);
  return res.json();
}

async function sbPost(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Error ${res.status} al guardar en ${table}`);
}

async function sbPatch(table, filter, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: "PATCH",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Error ${res.status} al actualizar en ${table}`);
}

// ── POOL KEY ─────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const poolKey = params.get("pool") || "";
if (!poolKey) {
  document.body.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;background:#F4F1EC;padding:24px;text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">🚗</div>
      <div style="font-size:20px;font-weight:700;color:#1B4332;margin-bottom:8px;">Pool Manager</div>
      <div style="font-size:14px;color:#888;max-width:280px;line-height:1.5;">Usá el link de tu pool para acceder. Pedíselo a la coordinadora del grupo.</div>
    </div>`;
  throw new Error("Pool no especificado");
}

const VERSION = "1.0-db";
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let familias = [];
let disponibilidad = [];
let fechasPool = [];
let fechasGlobales = [];
let tipoViaje = "ida-vuelta";
let familiaSeleccionada = localStorage.getItem("familia_" + poolKey) || "";
let mesActual = new Date().getMonth();
let anioActual = new Date().getFullYear();
let diasEntrenamiento = [3];
let notasTimeout = {};

function formatFecha(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function normalizarFecha(f) {
  if (!f) return "";
  return String(f).substring(0,10);
}

function getDiasEntrenamiento(mes, anio) {
  const dias = [];
  const d = new Date(anio, mes, 1);
  while (d.getMonth() === mes) {
    if (diasEntrenamiento.includes(d.getDay())) dias.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return dias;
}

function parseDias(val) {
  const map = {
    "lunes":1,"martes":2,"miércoles":3,"miercoles":3,
    "jueves":4,"viernes":5,"sábado":6,"sabado":6,"domingo":0
  };
  return String(val).toLowerCase().split(",").map(s => map[s.trim()]).filter(n => n !== undefined);
}

function getEstadoFecha(fechaStr) {
  // Primero busca en fechas del pool
  const enPool = fechasPool.find(f => normalizarFecha(f.fecha) === fechaStr);
  if (enPool) return { 
    estado: enPool.estado || "Activa", 
    motivo: enPool.motivo || "", 
    nota: enPool.nota || "",
    idFecha: enPool.id
  };
  // Luego en fechas globales (feriados)
  const enGlobal = fechasGlobales.find(f => normalizarFecha(f.fecha) === fechaStr);
  if (enGlobal) return { 
    estado: enGlobal.estado || "Cancelada", 
    motivo: enGlobal.motivo || "", 
    nota: "",
    idFecha: null
  };
  return { estado: "Activa", motivo: "", nota: "", idFecha: null };
}

function getAsignados(fechaStr) {
  const disp = disponibilidad.filter(d => normalizarFecha(d.fecha) === fechaStr);
  const ida = disp.filter(d => d.ida === true).map(d => d.participante);
  const vuelta = disp.filter(d => d.vuelta === true).map(d => d.participante);
  const voy = disp.filter(d => d.ida === true).map(d => d.participante);
  return { ida, vuelta, voy };
}

function getMiDisp(fechaStr) {
  if (!familiaSeleccionada) return { ida: false, vuelta: false };
  const d = disponibilidad.find(d => normalizarFecha(d.fecha) === fechaStr && d.participante === familiaSeleccionada);
  if (!d) return { ida: false, vuelta: false };
  return { ida: d.ida === true, vuelta: d.vuelta === true };
}

function renderFechas() {
  const lista = document.getElementById("fechasList");
  const dias = getDiasEntrenamiento(mesActual, anioActual);

  if (dias.length === 0) {
    lista.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gris)">No hay días este mes</div>';
    return;
  }

  const esIdaVuelta = tipoViaje === "ida-vuelta";
  const esRoundTrip = tipoViaje === "round-trip";
  const soloIda = tipoViaje === "ida";
  const soloVuelta = tipoViaje === "vuelta";

  lista.innerHTML = dias.map(fecha => {
    const fechaStr = formatFecha(fecha);
    const { estado, motivo, nota } = getEstadoFecha(fechaStr);
    const { ida, vuelta, voy } = getAsignados(fechaStr);
    const miDisp = getMiDisp(fechaStr);

    const diaNum = fecha.getDate();
    const mesNom = MESES[fecha.getMonth()].substring(0,3).toUpperCase();

    const cardClass = estado === "Cancelada" ? "cancelada" : estado === "Warning" ? "warning" : "";
    const badgeClass = estado === "Cancelada" ? "badge-cancel" : estado === "Warning" ? "badge-warn" : "badge-ok";
    const badgeText = estado === "Cancelada" ? "❌ Cancelada" : estado === "Warning" ? "⚠️ Tránsito" : "✅ Normal";
    const cancelada = estado === "Cancelada";

    const idaOcupada = ida.length > 0 && !miDisp.ida;
    const vueltaOcupada = vuelta.length > 0 && !miDisp.vuelta;
    const voyOcupado = voy.length > 0 && !miDisp.ida;

    let asignacionesHTML = "";
    if (esIdaVuelta) {
      asignacionesHTML = `
        <div class="grilla">
          <div class="asig-box">
            <div class="asig-label">🚗 Ida</div>
            ${ida.length > 0 ? `<div class="asig-nombre">${ida.join(", ")}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
          </div>
          <div class="asig-box">
            <div class="asig-label">🏠 Vuelta</div>
            ${vuelta.length > 0 ? `<div class="asig-nombre">${vuelta.join(", ")}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
          </div>
        </div>`;
    } else if (esRoundTrip) {
      asignacionesHTML = `
        <div class="asig-box" style="margin-bottom:0">
          <div class="asig-label">🚗 Lleva y trae</div>
          ${voy.length > 0 ? `<div class="asig-nombre">${voy.join(", ")}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
        </div>`;
    } else if (soloIda) {
      asignacionesHTML = `
        <div class="asig-box">
          <div class="asig-label">🚗 Ida</div>
          ${ida.length > 0 ? `<div class="asig-nombre">${ida.join(", ")}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
        </div>`;
    } else if (soloVuelta) {
      asignacionesHTML = `
        <div class="asig-box">
          <div class="asig-label">🏠 Vuelta</div>
          ${vuelta.length > 0 ? `<div class="asig-nombre">${vuelta.join(", ")}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
        </div>`;
    }

    let botonesHTML = "";
    if (familiaSeleccionada && !cancelada) {
      if (esIdaVuelta) {
        botonesHTML = `
          <div class="botones-disp grilla">
            <button class="toggle-btn ${miDisp.ida ? 'activo-ida' : ''}"
              onclick="toggleDisp(event,'${fechaStr}','ida')"
              ${idaOcupada ? 'disabled' : ''}>Ida</button>
            <button class="toggle-btn ${miDisp.vuelta ? 'activo-vuelta' : ''}"
              onclick="toggleDisp(event,'${fechaStr}','vuelta')"
              ${vueltaOcupada ? 'disabled' : ''}>Vuelta</button>
          </div>`;
      } else if (esRoundTrip) {
        botonesHTML = `
          <div class="botones-disp">
            <button class="toggle-btn ${miDisp.ida ? 'activo-voy' : ''}" style="width:100%"
              onclick="toggleDisp(event,'${fechaStr}','ida')"
              ${voyOcupado ? 'disabled' : ''}>Voy 🚗</button>
          </div>`;
      } else if (soloIda) {
        botonesHTML = `
          <div class="botones-disp">
            <button class="toggle-btn ${miDisp.ida ? 'activo-ida' : ''}" style="width:100%"
              onclick="toggleDisp(event,'${fechaStr}','ida')"
              ${idaOcupada ? 'disabled' : ''}>Ida</button>
          </div>`;
      } else if (soloVuelta) {
        botonesHTML = `
          <div class="botones-disp">
            <button class="toggle-btn ${miDisp.vuelta ? 'activo-vuelta' : ''}" style="width:100%"
              onclick="toggleDisp(event,'${fechaStr}','vuelta')"
              ${vueltaOcupada ? 'disabled' : ''}>Vuelta</button>
          </div>`;
      }
    }

    const notaValor = nota || "";

    return `
    <div class="fecha-card ${cardClass}">
      <div class="fecha-header">
        <div class="fecha-dia">${diaNum} ${mesNom}</div>
        <div class="fecha-badge ${badgeClass}">${badgeText}</div>
      </div>
      ${motivo ? `<div class="fecha-motivo">${motivo}</div>` : ""}
      ${asignacionesHTML}
      ${botonesHTML}
      ${!familiaSeleccionada && !cancelada ? `<div class="sin-familia">Seleccioná tu familia arriba para cargar disponibilidad</div>` : ""}
      ${!cancelada ? `
      <div class="nota-container">
        <input type="text" class="nota-input" placeholder="Nota del grupo" 
          value="${notaValor.replace(/"/g, '&quot;')}"
          onchange="guardarNota('${fechaStr}', this.value)"
          oninput="notaChanged('${fechaStr}', this.value)">
      </div>` : ""}
    </div>`;
  }).join("");

  // Scroll a fecha actual solo en mes en curso
  const hoy = formatFecha(new Date());
  if (mesActual === new Date().getMonth() && anioActual === new Date().getFullYear()) {
    setTimeout(() => {
      const cards = document.querySelectorAll('.fecha-card');
      let targetIndex = -1;
      for (let i = 0; i < dias.length; i++) {
        if (formatFecha(dias[i]) >= hoy) { targetIndex = i; break; }
      }
      if (targetIndex < 0 && cards.length > 0) targetIndex = cards.length - 1;
      if (targetIndex >= 0 && cards[targetIndex]) {
        cards[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 500);
  }
}

function notaChanged(fechaStr, valor) {
  clearTimeout(notasTimeout[fechaStr]);
  notasTimeout[fechaStr] = setTimeout(() => guardarNota(fechaStr, valor), 1500);
}

async function guardarNota(fechaStr, valor) {
  clearTimeout(notasTimeout[fechaStr]);
  try {
    // Buscar si ya existe la fila en fechas_pool
    const existente = fechasPool.find(f => normalizarFecha(f.fecha) === fechaStr);
    if (existente) {
      await sbPatch("fechas_pool", `id=eq.${existente.id}`, { nota: valor });
      existente.nota = valor;
    } else {
      // Crear nueva fila
      await sbPost("fechas_pool", {
        pool_id: poolKey,
        fecha: fechaStr,
        estado: "Activa",
        nota: valor
      });
      fechasPool.push({ pool_id: poolKey, fecha: fechaStr, estado: "Activa", nota: valor });
    }
    showToast("✓ Nota guardada");
  } catch(e) {
    console.error(e);
    showToast("Error al guardar nota");
  }
}

async function toggleDisp(event, fechaStr, tipo) {
  event.stopPropagation();
  if (!familiaSeleccionada) { showToast("Primero elegí tu familia ↑"); return; }

  let entry = disponibilidad.find(d => normalizarFecha(d.fecha) === fechaStr && d.participante === familiaSeleccionada);
  if (!entry) {
    entry = { fecha: fechaStr, participante: familiaSeleccionada, pool_id: poolKey, ida: false, vuelta: false };
    disponibilidad.push(entry);
  }

  if (tipo === "ida") entry.ida = !entry.ida;
  else entry.vuelta = !entry.vuelta;

  renderFechas();
  showToast("Guardando...");

  try {
    // upsert — Supabase maneja el conflicto por unique(pool_id, fecha, participante)
    await sbPost("disponibilidad", {
      pool_id: poolKey,
      fecha: fechaStr,
      participante: familiaSeleccionada,
      ida: entry.ida,
      vuelta: entry.vuelta
    });
    showToast("✓ Guardado");
  } catch(e) {
    console.error(e);
    showToast("Error al guardar");
  }
}

function abrirMapa(e) {
  e.preventDefault();
  const activas = familias.filter(f => f.activa === true);
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  let url;
  if (isMobile) {
    const waypointList = activas.map(f => {
      if (f.lat && f.lng) return `${f.lat},${f.lng}`;
      return encodeURIComponent((f.direccion || "") + ", CABA, Argentina");
    });
    url = `https://maps.google.com/maps/dir/?api=1&waypoints=${waypointList.join("|")}&travelmode=driving`;
  } else {
    const waypoints = activas.map(f => {
      if (f.lat && f.lng) return `${f.lat},${f.lng}`;
      return encodeURIComponent((f.direccion || "") + ", CABA, Argentina");
    }).join("/");
    url = `https://www.google.com/maps/dir/${waypoints}`;
  }
  window.open(url, "_blank");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  setTimeout(() => t.classList.remove("visible"), 2000);
}

function cambiarMes(dir) {
  mesActual += dir;
  if (mesActual > 11) { mesActual = 0; anioActual++; }
  if (mesActual < 0) { mesActual = 11; anioActual--; }
  actualizarMesLabel();
  renderFechas();
}

function actualizarMesLabel() {
  document.getElementById("mesLabel").textContent = `${MESES[mesActual].toUpperCase()} ${anioActual}`;
}

function onFamiliaChange() {
  familiaSeleccionada = document.getElementById("selectFamilia").value;
  localStorage.setItem("familia_" + poolKey, familiaSeleccionada);
  renderFechas();
}

async function cargarDatos() {
  try {
    const [pool, parts, disp, fechasPl, fechasGl] = await Promise.all([
      sbGet("pools", `?id=eq.${poolKey}`),
      sbGet("participantes", `?pool_id=eq.${poolKey}&activa=eq.true&order=nombre`),
      sbGet("disponibilidad", `?pool_id=eq.${poolKey}`),
      sbGet("fechas_pool", `?pool_id=eq.${poolKey}`),
      sbGet("fechas_globales", "")
    ]);

    if (!pool || pool.length === 0) {
      showToast("Pool no encontrado");
      return;
    }

    const poolData = pool[0];
    familias = parts;
    disponibilidad = disp;
    fechasPool = fechasPl;
    fechasGlobales = fechasGl;

    document.getElementById("poolNombre").textContent = poolData.nombre;
    document.title = poolData.nombre;

    if (poolData.dias) diasEntrenamiento = parseDias(poolData.dias);
    if (poolData.tipo_viaje) tipoViaje = poolData.tipo_viaje.toLowerCase();

    const sel = document.getElementById("selectFamilia");
    familias.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.nombre;
      opt.textContent = f.nombre;
      if (f.nombre === familiaSeleccionada) opt.selected = true;
      sel.appendChild(opt);
    });

  } catch(e) {
    console.error("Error cargando datos:", e);
    showToast("Error de conexión");
  }

  actualizarMesLabel();
  renderFechas();
}

cargarDatos();
</script>
