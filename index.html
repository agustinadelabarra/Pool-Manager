<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pool Hockey</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1B4332;
    --verde-mid: #2D6A4F;
    --verde-claro: #40916C;
    --verde-light: #52B788;
    --amarillo: #E9C46A;
    --rojo: #E76F51;
    --fondo: #F4F1EC;
    --blanco: #FFFFFF;
    --texto: #1A1A1A;
    --gris: #888;
    --gris-claro: #E8E4DC;
    --sombra: 0 1px 8px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    font-size: 14px;
  }

  /* HEADER */
  .header {
    background: var(--verde);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pool-nombre {
    font-size: 15px;
    font-weight: 700;
    color: var(--blanco);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .selector-familia {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 5px 10px;
    color: var(--blanco);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    max-width: 110px;
  }

  .selector-familia option { color: var(--texto); background: var(--blanco); }

  .btn-mapa {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    text-decoration: none;
  }

  /* NAV MESES */
  .nav-mes {
    background: var(--verde-mid);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
  }

  .mes-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--blanco);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-mes {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    color: var(--blanco);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* LEYENDA */
  .leyenda {
    display: flex;
    gap: 14px;
    padding: 7px 16px;
    background: var(--blanco);
    border-bottom: 1px solid var(--gris-claro);
  }

  .ley-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--gris);
    font-weight: 500;
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-ok { background: var(--verde-light); }
  .dot-warn { background: var(--amarillo); }
  .dot-cancel { background: var(--rojo); }

  /* LISTA FECHAS */
  .fechas-list {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fecha-card {
    background: var(--blanco);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--sombra);
    border-left: 3px solid var(--verde-light);
  }

  .fecha-card.warning { border-left-color: var(--amarillo); }
  .fecha-card.cancelada { border-left-color: var(--rojo); opacity: 0.65; }

  .fecha-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .fecha-dia {
    font-size: 15px;
    font-weight: 700;
    color: var(--texto);
  }

  .fecha-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .badge-ok { background: #E3F4EC; color: var(--verde-mid); }
  .badge-warn { background: #FDF3D8; color: #9A6D0A; }
  .badge-cancel { background: #FDECEA; color: var(--rojo); }

  .fecha-motivo {
    font-size: 10px;
    color: var(--gris);
    margin-bottom: 7px;
    margin-top: -4px;
  }

  /* ASIGNACIONES */
  .asignaciones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 7px;
  }

  .asig-box {
    background: var(--fondo);
    border-radius: 7px;
    padding: 6px 8px;
  }

  .asig-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }

  .asig-nombre {
    font-size: 12px;
    font-weight: 600;
    color: var(--texto);
  }

  .asig-vacio {
    font-size: 11px;
    color: var(--gris);
    font-style: italic;
  }

  /* BOTONES IDA/VUELTA */
  .mi-disp {
    border-top: 1px solid var(--gris-claro);
    padding-top: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mi-disp-label {
    font-size: 10px;
    color: var(--gris);
    font-weight: 500;
    white-space: nowrap;
  }

  .toggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    flex: 1;
  }

  .toggle-btn {
    border: 1.5px solid var(--gris-claro);
    background: var(--blanco);
    border-radius: 7px;
    padding: 5px 0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--gris);
    text-align: center;
    width: 100%;
  }

  .toggle-btn.activo-ida {
    background: var(--verde);
    border-color: var(--verde);
    color: var(--blanco);
  }

  .toggle-btn.activo-vuelta {
    background: var(--verde-claro);
    border-color: var(--verde-claro);
    color: var(--blanco);
  }

  .toggle-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .sin-familia {
    font-size: 10px;
    color: var(--amarillo);
    font-weight: 500;
    padding-top: 5px;
    border-top: 1px solid var(--gris-claro);
  }

  /* LOADING */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--gris);
    gap: 10px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--gris-claro);
    border-top-color: var(--verde);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--texto);
    color: var(--blanco);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    transition: transform 0.25s ease;
    z-index: 1000;
    white-space: nowrap;
  }

  .toast.visible { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="pool-nombre" id="poolNombre">Pool</div>
  <select class="selector-familia" id="selectFamilia" onchange="onFamiliaChange()">
    <option value="">¿Quién sos?</option>
  </select>
  <a class="btn-mapa" id="btnMapa" href="#" onclick="abrirMapa(event)">🚗</a>
</div>

<div class="nav-mes">
  <button class="btn-mes" onclick="cambiarMes(-1)">‹</button>
  <div class="mes-label" id="mesLabel">—</div>
  <button class="btn-mes" onclick="cambiarMes(1)">›</button>
</div>

<div class="leyenda">
  <div class="ley-item"><div class="dot dot-ok"></div> Normal</div>
  <div class="ley-item"><div class="dot dot-warn"></div> Tránsito complicado</div>
  <div class="ley-item"><div class="dot dot-cancel"></div> Cancelada</div>
</div>

<div class="fechas-list" id="fechasList">
  <div class="loading"><div class="spinner"></div><span>Cargando...</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJ0Au8H96uecoplvpvyMi6rvAzVQ3ZBYGn7ztIwUOP9fjkl5pQC25KaT33XJoM4DWi/exec";

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const FERIADOS = {
  "2026-01-01":"Año Nuevo","2026-02-16":"Carnaval","2026-02-17":"Carnaval",
  "2026-03-23":"Día no laborable","2026-03-24":"Día de la Memoria",
  "2026-04-02":"Día de Malvinas","2026-04-03":"Viernes Santo",
  "2026-05-01":"Día del Trabajo","2026-05-25":"Revolución de Mayo",
  "2026-06-15":"Día de Güemes","2026-06-20":"Día de Belgrano",
  "2026-07-09":"Día de la Independencia","2026-07-10":"Día no laborable",
  "2026-08-17":"Día de San Martín","2026-10-12":"Día de la Raza",
  "2026-11-23":"Soberanía Nacional","2026-12-07":"Día no laborable",
  "2026-12-08":"Inmaculada Concepción","2026-12-25":"Navidad"
};

let familias = [];
let disponibilidad = [];
let fechasSheet = [];
let config = {};
let familiaSeleccionada = localStorage.getItem("familiaPool") || "";
let mesActual = new Date().getMonth();
let anioActual = new Date().getFullYear();
let diasEntrenamiento = [3]; // 3 = miércoles por defecto

function formatFecha(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function normalizarFecha(f) {
  if (!f) return "";
  const str = String(f);
  if (str.includes("T")) return str.substring(0,10);
  return str.substring(0,10);
}

function getDiasEntrenamiento(mes, anio) {
  const dias = [];
  const d = new Date(anio, mes, 1);
  while (d.getMonth() === mes) {
    if (diasEntrenamiento.includes(d.getDay())) {
      dias.push(new Date(d));
    }
    d.setDate(d.getDate()+1);
  }
  return dias;
}

function parseDias(val) {
  const map = {
    "lunes":1,"martes":2,"miércoles":3,"miercoles":3,
    "jueves":4,"viernes":5,"sábado":6,"sabado":6,"domingo":0
  };
  return String(val).toLowerCase().split(",").map(s => map[s.trim()]).filter(n => n !== undefined);
}

function getEstadoFecha(fechaStr) {
  // Buscar en sheet primero
  const enSheet = fechasSheet.find(f => normalizarFecha(f.Fecha) === fechaStr);
  if (enSheet) return { estado: enSheet.Estado || "Activa", motivo: enSheet.Motivo || "" };
  // Feriado
  if (FERIADOS[fechaStr]) return { estado: "Cancelada", motivo: FERIADOS[fechaStr] };
  return { estado: "Activa", motivo: "" };
}

function getAsignados(fechaStr) {
  const disp = disponibilidad.filter(d => normalizarFecha(d.Fecha) === fechaStr);
  const ida = disp.filter(d => d.Ida === true || d.Ida === "TRUE" || d.Ida === "true").map(d => d.Familia);
  const vuelta = disp.filter(d => d.Vuelta === true || d.Vuelta === "TRUE" || d.Vuelta === "true").map(d => d.Familia);
  return { ida, vuelta };
}

function getMiDisp(fechaStr) {
  if (!familiaSeleccionada) return { ida: false, vuelta: false };
  const d = disponibilidad.find(d => normalizarFecha(d.Fecha) === fechaStr && d.Familia === familiaSeleccionada);
  if (!d) return { ida: false, vuelta: false };
  return {
    ida: d.Ida === true || d.Ida === "TRUE" || d.Ida === "true",
    vuelta: d.Vuelta === true || d.Vuelta === "TRUE" || d.Vuelta === "true"
  };
}

function renderFechas() {
  const lista = document.getElementById("fechasList");
  const dias = getDiasEntrenamiento(mesActual, anioActual);

  if (dias.length === 0) {
    lista.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gris)">No hay días de entrenamiento este mes</div>';
    return;
  }

  const mostrarIda = config.Ida !== "FALSE" && config.Ida !== false;
  const mostrarVuelta = config.Vuelta !== "FALSE" && config.Vuelta !== false;

  lista.innerHTML = dias.map(fecha => {
    const fechaStr = formatFecha(fecha);
    const { estado, motivo } = getEstadoFecha(fechaStr);
    const { ida, vuelta } = getAsignados(fechaStr);
    const miDisp = getMiDisp(fechaStr);

    const diaNum = fecha.getDate();
    const mesNom = MESES[fecha.getMonth()].substring(0,3).toUpperCase();

    const cardClass = estado === "Cancelada" ? "cancelada" : estado === "Warning" ? "warning" : "";
    const badgeClass = estado === "Cancelada" ? "badge-cancel" : estado === "Warning" ? "badge-warn" : "badge-ok";
    const badgeText = estado === "Cancelada" ? "❌ Cancelada" : estado === "Warning" ? "⚠️ Tránsito" : "✅ Normal";

    const idaOcupada = ida.length > 0 && !miDisp.ida;
    const vueltaOcupada = vuelta.length > 0 && !miDisp.vuelta;

    const idaNombre = ida.length > 0 ? ida.join(", ") : null;
    const vueltaNombre = vuelta.length > 0 ? vuelta.join(", ") : null;

    return `
    <div class="fecha-card ${cardClass}">
      <div class="fecha-header">
        <div class="fecha-dia">${diaNum} ${mesNom}</div>
        <div class="fecha-badge ${badgeClass}">${badgeText}</div>
      </div>
      ${motivo ? `<div class="fecha-motivo">${motivo}</div>` : ""}
      <div class="asignaciones">
        ${mostrarIda ? `
        <div class="asig-box">
          <div class="asig-label">🚗 Ida</div>
          ${idaNombre ? `<div class="asig-nombre">${idaNombre}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
        </div>` : ""}
        ${mostrarVuelta ? `
        <div class="asig-box">
          <div class="asig-label">🏠 Vuelta</div>
          ${vueltaNombre ? `<div class="asig-nombre">${vueltaNombre}</div>` : `<div class="asig-vacio">Sin asignar</div>`}
        </div>` : ""}
      </div>
      ${familiaSeleccionada && estado !== "Cancelada" ? `
      <div class="mi-disp">
        <div class="mi-disp-label">Yo puedo:</div>
        <div class="toggles">
          ${mostrarIda ? `<button class="toggle-btn ${miDisp.ida ? 'activo-ida' : ''}" 
            onclick="toggleDisp(event,'${fechaStr}','ida')"
            ${idaOcupada ? 'disabled' : ''}>Ida</button>` : ""}
          ${mostrarVuelta ? `<button class="toggle-btn ${miDisp.vuelta ? 'activo-vuelta' : ''}" 
            onclick="toggleDisp(event,'${fechaStr}','vuelta')"
            ${vueltaOcupada ? 'disabled' : ''}>Vuelta</button>` : ""}
        </div>
      </div>` : ""}
      ${!familiaSeleccionada && estado !== "Cancelada" ? `
      <div class="sin-familia">Seleccioná tu familia arriba para cargar disponibilidad</div>` : ""}
    </div>`;
  }).join("");
}

async function toggleDisp(event, fechaStr, tipo) {
  event.stopPropagation();
  if (!familiaSeleccionada) { showToast("Primero elegí tu familia ↑"); return; }

  let entry = disponibilidad.find(d => normalizarFecha(d.Fecha) === fechaStr && d.Familia === familiaSeleccionada);
  if (!entry) {
    entry = { Fecha: fechaStr, Familia: familiaSeleccionada, Ida: false, Vuelta: false };
    disponibilidad.push(entry);
  }

  if (tipo === "ida") entry.Ida = !entry.Ida;
  else entry.Vuelta = !entry.Vuelta;

  renderFechas();
  showToast("Guardando...");

  try {
    const url = `${SCRIPT_URL}?action=guardar&fecha=${fechaStr}&familia=${encodeURIComponent(familiaSeleccionada)}&ida=${entry.Ida}&vuelta=${entry.Vuelta}`;
    await fetch(url, { mode: "no-cors" });
    showToast("✓ Guardado");
  } catch(e) {
    showToast("Error al guardar");
  }
}

function abrirMapa(e) {
  e.preventDefault();
  const destino = config.Destino || "Figueroa Alcorta y La Pampa, Buenos Aires";
  const dirs = familias
    .filter(f => f.Activa === true || f.Activa === "TRUE" || f.Activa === "true")
    .map(f => encodeURIComponent(f.Dirección + ", Buenos Aires"))
    .join("/");
  const url = `https://www.google.com/maps/dir/${dirs}/${encodeURIComponent(destino)}`;
  window.open(url, "_blank");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  setTimeout(() => t.classList.remove("visible"), 2000);
}

function cambiarMes(dir) {
  mesActual += dir;
  if (mesActual > 11) { mesActual = 0; anioActual++; }
  if (mesActual < 0) { mesActual = 11; anioActual--; }
  actualizarMesLabel();
  renderFechas();
}

function actualizarMesLabel() {
  document.getElementById("mesLabel").textContent = `${MESES[mesActual].toUpperCase()} ${anioActual}`;
}

function onFamiliaChange() {
  familiaSeleccionada = document.getElementById("selectFamilia").value;
  localStorage.setItem("familiaPool", familiaSeleccionada);
  renderFechas();
}

async function cargarDatos() {
  try {
    const [resFamilias, resDisp, resFechas, resConfig] = await Promise.all([
      fetch(`${SCRIPT_URL}?action=familias`),
      fetch(`${SCRIPT_URL}?action=disponibilidad`),
      fetch(`${SCRIPT_URL}?action=fechas`),
      fetch(`${SCRIPT_URL}?action=config`)
    ]);

    familias = await resFamilias.json();
    disponibilidad = await resDisp.json();
    fechasSheet = await resFechas.json();
    const configArr = await resConfig.json();

    // Parsear config
    configArr.forEach(row => { config[row.Clave] = row.Valor; });

    // Nombre del pool
    if (config.Nombre) document.getElementById("poolNombre").textContent = config.Nombre;

    // Días de entrenamiento
    if (config.Dias) diasEntrenamiento = parseDias(config.Dias);

    // Poblar selector
    const sel = document.getElementById("selectFamilia");
    familias.filter(f => f.Activa === true || f.Activa === "TRUE" || f.Activa === "true").forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.Nombre;
      opt.textContent = f.Nombre.split(" ")[0];
      if (f.Nombre === familiaSeleccionada) opt.selected = true;
      sel.appendChild(opt);
    });

  } catch(e) {
    console.error("Error:", e);
    // Fallback familias
    familias = [
      {Nombre:"Juana Sosa", Dirección:"Teodoro García 2074 1B", Activa:true},
      {Nombre:"Oli Icazatti", Dirección:"Luis María Campos 1640 6B", Activa:true},
      {Nombre:"Maggie Ferro", Dirección:"La Pampa 1782 4to", Activa:true},
      {Nombre:"Josefina Amorortu", Dirección:"Arribeños 1610 7mo", Activa:true}
    ];
    const sel = document.getElementById("selectFamilia");
    familias.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.Nombre;
      opt.textContent = f.Nombre.split(" ")[0];
      if (f.Nombre === familiaSeleccionada) opt.selected = true;
      sel.appendChild(opt);
    });
    showToast("Sin conexión — modo offline");
  }

  actualizarMesLabel();
  renderFechas();
}

cargarDatos();
</script>
</body>
</html>
